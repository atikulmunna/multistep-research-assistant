name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Secret hygiene scan
        run: python scripts/scan_secrets.py

      - name: Run tests
        run: pytest -q

      - name: Benchmark smoke run (mock providers)
        env:
          LLM_PROVIDER: mock
          SEARCH_PROVIDER: mock
          REPORTS_DIRECTORY: ./reports_ci
          SESSION_DB_PATH: ./reports_ci/sessions.db
        run: |
          research-assistant benchmark --num-queries 1 --json --reset-first > benchmark_smoke.json
          python - <<'PY'
          import json
          payload = json.load(open("benchmark_smoke.json", "r", encoding="utf-8"))
          summary = payload.get("summary", {})
          assert summary.get("queries_run") == 1, summary
          print("Benchmark smoke passed.")
          PY
